<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>Sem internet · Prog Admin</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0b0c; color: #f3eee4;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; box-sizing: border-box; text-align: center; }
  img { width: 88px; height: 88px; border-radius: 22px; margin-bottom: 18px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { color: #a8a39a; margin: 0 0 22px; max-width: 30ch; }
  button { font: inherit; font-weight: 800; border: 0; border-radius: 999px; padding: 12px 26px; background: #c9a15a; color: #0b0b0c;
           touch-action: manipulation; }
</style>
</head>
<body>
  <main>
    <img src="/admin-app/icon-192.png" alt="">
    <h1>Sem conexão</h1>
    <p>O Prog Admin precisa de internet para mostrar vendas, estoque e financeiro sempre atualizados.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </main>
  <script>addEventListener('online', () => location.reload());</script>
</body>
</html>
